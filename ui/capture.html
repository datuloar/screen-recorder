<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recording controls</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="capture.js"></script>
</head>
<body class="compact-capture">
  <main aria-label="Recording controls" data-i18n-label="Recording controls">
    <div class="compact-heading">
      <div><p id="capture-phase" role="status" tabindex="-1" data-i18n="Connecting to recorder…">Connecting to recorder…</p><time id="capture-time" aria-label="Recording duration" data-i18n-label="Recording duration">00:00</time></div>
      <button id="capture-expand" data-i18n="Expand">Expand</button>
    </div>
    <div class="compact-actions">
      <button id="capture-pause" disabled>Pause</button>
      <button id="capture-stop" class="primary" disabled data-i18n="Stop and save">Stop and save</button>
    </div>
    <p id="capture-error" role="alert" hidden></p>
    <button id="capture-retry" hidden data-i18n="Reconnect">Reconnect</button>
  </main>
</body>
</html>
