name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to retry, or leave empty for a new main release
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - id: version
        name: Reserve release version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          if [[ -n "$REQUESTED_TAG" ]]; then
            python3 scripts/package.py check-version --tag "$REQUESTED_TAG"
            git show-ref --verify "refs/tags/$REQUESTED_TAG"
            echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/release.py prepare --source "$SOURCE_COMMIT" --push
          fi

  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}

  windows:
    needs: [prepare, checks]
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: cargo build --release --locked -p screen-recorder
      - name: Cache media tools
        id: media
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            vendor/media
            vendor/ffmpeg-8.0.tar.xz
            vendor/ffmpeg-configure.txt
          key: media-windows-x64-${{ hashFiles('scripts/media-source.json', 'scripts/build-media.sh') }}
      - run: python scripts/prepare_media.py
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        if: steps.media.outputs.cache-hit != 'true'
        with:
          msystem: MINGW64
          update: true
          install: make diffutils mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf
      - name: Build media tools
        if: steps.media.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build-media.sh
      - run: python scripts/verify_media.py vendor/media/bin
      - run: python scripts/package.py windows
      - name: Packaged version smoke test
        shell: pwsh
        run: |
          $package = Get-ChildItem dist -Directory -Filter 'ScreenRecorder-*-windows-x64'
          & (Join-Path $package.FullName 'ScreenRecorder.exe') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-package
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: [prepare, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: cargo build --release --locked -p screen-recorder
      - name: Cache media tools
        id: media
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            vendor/media
            vendor/ffmpeg-8.0.tar.xz
            vendor/ffmpeg-configure.txt
          key: media-macos-${{ matrix.arch }}-${{ hashFiles('scripts/media-source.json', 'scripts/build-media.sh') }}
      - run: python3 scripts/prepare_media.py
      - if: steps.media.outputs.cache-hit != 'true'
        run: bash scripts/build-media.sh
      - run: python3 scripts/verify_media.py vendor/media/bin
      - name: Collect architecture build
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "vendor/macos-$ARCH"
          cp target/release/screen-recorder "vendor/macos-$ARCH/"
          cp target/release/libRecorderBridge.dylib "vendor/macos-$ARCH/"
          cp vendor/media/bin/{ffmpeg,ffprobe} "vendor/macos-$ARCH/"
          cp vendor/ffmpeg-configure.txt "vendor/macos-$ARCH/configure.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.arch }}
          path: vendor/macos-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 7

  macos-package:
    needs: [prepare, macos]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.97.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: macos-*
          path: vendor
      - run: python3 scripts/prepare_media.py
      - name: Build and verify universal app
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          cp vendor/macos-arm64/configure.txt vendor/ffmpeg-configure.txt
          python3 scripts/package.py macos
          codesign --verify --deep --strict --verbose=2 'dist/Screen Recorder.app'
          'dist/Screen Recorder.app/Contents/MacOS/screen-recorder' --version
          mkdir -p dist/dmg
          mv 'dist/Screen Recorder.app' dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname 'Screen Recorder' -srcfolder dist/dmg -ov -format UDZO "dist/ScreenRecorder-${TAG#v}-macos-universal.dmg"
          hdiutil verify "dist/ScreenRecorder-${TAG#v}-macos-universal.dmg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-package
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, windows, macos-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*-package'
          path: dist
          merge-multiple: true
      - name: Prepare changelog and checksums
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 scripts/package.py notes --tag "$TAG"
      - name: Publish both packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 scripts/release.py publish --tag "$TAG"
