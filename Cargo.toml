[workspace]
members = ["crates/core", "crates/platform", "crates/media", "apps/desktop"]
resolver = "3"

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
recorder-core = { path = "crates/core" }
recorder-platform = { path = "crates/platform" }
recorder-media = { path = "crates/media" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
